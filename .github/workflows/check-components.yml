# Checks new/modified entries of OfficialComponents.json against the README requirements and posts a summary comment
name: Check component submissions

on:
  # pull_request_target gives a write token for PRs coming from forks; PR code is never checked out nor executed
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - 'OfficialComponents.json'

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: check-components-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Checks out the BASE branch only (trusted script); the PR JSON is read through the API as data
      - uses: actions/checkout@v4

      - uses: actions/github-script@v7
        with:
          script: |
            const run = require('./.github/scripts/check-components.js');
            await run({ github, context, core });
